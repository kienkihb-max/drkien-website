<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="markTitle">
<title id="markTitle">Chạy bộ cùng bác sĩ Kiên</title>
<!--
  Bản rút gọn của logo-bs-kien.svg: bỏ vòng chữ, chỉ giữ người chạy.
  Dùng cho cỡ nhỏ (favicon, ảnh đại diện) — ở 16–32px thì chữ vòng cung
  của bản đầy đủ không còn đọc được, chỉ thành một vệt mờ.

  Người chạy vẽ giống hệt bản đầy đủ, chỉ phóng to lên cho kín khung.
  Sửa dáng hay màu thì sửa song song ở cả hai file cho khớp.
-->

<!-- Đĩa nền và vòng ngoài -->
<circle cx="256" cy="256" r="244" fill="#f3f6ff"/>
<circle cx="256" cy="256" r="244" fill="none" stroke="#1e3a6e" stroke-width="16"/>

<!-- Người chạy, phóng to 1.55 lần quanh tâm so với bản đầy đủ -->
<g transform="translate(256,256) scale(1.55) translate(-230,-239)" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M116 176 Q158 168 198 172" stroke="#3874ff" stroke-width="12"/>
  <path d="M106 208 Q152 200 192 204" stroke="#3874ff" stroke-width="10"/>
  <path d="M124 240 Q162 234 190 237" stroke="#3874ff" stroke-width="8.5"/>
  <path d="M240 258 L192 300 L150 340" stroke="#3364db" stroke-width="25"/>
  <path d="M278 194 L226 212" stroke="#3874ff" stroke-width="21"/>
  <path d="M292 180 L240 258 L302 246 L272 306" stroke="#1e3a6e" stroke-width="26"/>
  <path d="M292 184 L334 204 L342 170" stroke="#3874ff" stroke-width="21"/>
  <circle cx="312" cy="148" r="26" fill="#1e3a6e" stroke="none"/>
</g>
</svg>
